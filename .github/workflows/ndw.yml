# Elke 5 minuten de open data van NDW (laadpalen en afsluitingen) ophalen en in kleine
# stukjes op de branch ndw-data zetten. De app haalt ze daar op (zie tools/ndw.py).
# GitHub draait geplande acties niet precies op tijd: reken op elke 5 tot 15 minuten.
name: NDW-data
on:
  schedule:
    # Niet precies op het hele uur (dan is GitHub het drukst)
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ndw
  cancel-in-progress: false
jobs:
  ndw:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools
      - run: python3 tools/ndw.py out
      # Steeds één verse versie (zonder geschiedenis), zodat de repository niet volloopt
      - name: Naar de branch ndw-data
        working-directory: out
        run: |
          git init -q -b ndw-data
          git config user.name 'NDW-data'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -qm "NDW-data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ndw-data
