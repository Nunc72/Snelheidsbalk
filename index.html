<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="VeloVerde">
<meta name="theme-color" content="#48484A">
<meta name="color-scheme" content="light dark">
<title>VeloVerde</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="style.css?v=20">
</head>
<body>
<div id="map"></div>

<div class="car" id="car" aria-label="Je positie"><div><div></div></div></div>

<div class="bar" id="bar">
  <div class="road" id="road" aria-label="Huidige weg"></div>
  <span class="spd" id="spd">–</span>
  <span class="lim" id="lim" hidden aria-label="Maximumsnelheid"></span>
</div>

<div class="card instr" id="instr" hidden>
  <i class="ti ti-arrow-up" id="instr-icon" aria-hidden="true"></i>
  <div class="instr-text">
    <div class="instr-title" id="instr-title"></div>
    <div class="instr-sub" id="instr-sub"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<button class="recenter" id="recenter" hidden aria-label="Centreer op je positie"><i class="ti ti-current-location" aria-hidden="true"></i></button>

<div class="card bottom" id="bottom-idle">
  <button class="where" id="where"><i class="ti ti-search" aria-hidden="true"></i>Waarheen?</button>
  <div class="meta"><span id="gps">Wachten op GPS…</span><span id="demo-badge" hidden>DEMO</span><span>© OpenStreetMap · OpenFreeMap · Valhalla</span></div>
</div>

<div class="card bottom" id="bottom-nav" hidden>
  <div class="destlbl" id="destlbl"></div>
  <div class="nav">
  <div><div class="eta" id="eta">--:--</div><div class="lbl">aankomst</div></div>
  <div class="mid"><div class="min" id="remain-time">-- min</div><div class="lbl" id="remain-dist">-- km</div></div>
  <button class="edit" id="edit" aria-label="Bestemming wijzigen"><i class="ti ti-pencil" aria-hidden="true"></i></button>
  </div>
</div>

<div class="sheet" id="search" hidden>
  <form class="sheet-head" id="qform" autocomplete="on">
    <button type="button" class="icon-btn" id="qback" aria-label="Terug"><i class="ti ti-arrow-left" aria-hidden="true"></i></button>
    <div class="fields">
      <div class="qwrap" id="fromwrap" hidden>
        <span class="flbl" aria-hidden="true">Van</span>
        <input id="qfrom" type="text" placeholder="Huidige locatie" aria-label="Van" autocomplete="off" autocorrect="off" autocapitalize="words" enterkeyhint="go">
        <button type="button" class="qclear" id="qfromclear" aria-label="Veld leegmaken" hidden><i class="ti ti-x" aria-hidden="true"></i></button>
      </div>
      <div class="qwrap">
        <span class="flbl" aria-hidden="true">Naar</span>
        <input id="q" name="address" type="text" placeholder="Zoek adres of plaats" autocomplete="street-address" autocorrect="off" autocapitalize="words" enterkeyhint="go">
        <button type="button" class="qclear" id="qclear" aria-label="Veld leegmaken" hidden><i class="ti ti-x" aria-hidden="true"></i></button>
      </div>
    </div>
    <button type="button" class="icon-btn swap" id="swap" aria-label="Route omdraaien" hidden><i class="ti ti-arrows-up-down" aria-hidden="true"></i></button>
    <!-- Onzichtbare velden zodat iOS bij 'Thuis'/'Werk' ook postcode en plaats invult -->
    <input class="af" id="q-postcode" name="postal-code" autocomplete="postal-code" tabindex="-1" aria-hidden="true">
    <input class="af" id="q-city" name="city" autocomplete="address-level2" tabindex="-1" aria-hidden="true">
  </form>
  <div class="modes" role="radiogroup" aria-label="Vervoer">
    <button type="button" role="radio" data-mode="auto"><i class="ti ti-car" aria-hidden="true"></i>Auto</button>
    <button type="button" role="radio" data-mode="bicycle"><i class="ti ti-bike" aria-hidden="true"></i>Fiets</button>
    <button type="button" role="radio" data-mode="pedestrian"><i class="ti ti-walk" aria-hidden="true"></i>Lopen</button>
  </div>
  <div class="tabs" role="tablist" aria-label="Bestemmingen">
    <button type="button" role="tab" data-tab="recent" aria-selected="true"><i class="ti ti-history" aria-hidden="true"></i>Recent</button>
    <button type="button" role="tab" data-tab="fav" aria-selected="false"><i class="ti ti-star" aria-hidden="true"></i>Favorieten</button>
    <button type="button" role="tab" data-tab="map" aria-selected="false"><i class="ti ti-map" aria-hidden="true"></i>Kaart</button>
    <button type="button" role="tab" data-tab="routes" aria-selected="false"><i class="ti ti-route" aria-hidden="true"></i>Routes</button>
  </div>
  <ul id="results"></ul>
  <div class="pick" id="pick" hidden>
    <div class="pickwrap">
      <div class="pickmap" id="pickmap"></div>
      <svg class="pin" viewBox="0 0 36 48" aria-hidden="true"><path d="M18 46.5C18 46.5 34 28.5 34 17A16 16 0 0 0 2 17C2 28.5 18 46.5 18 46.5Z"/><circle cx="18" cy="17" r="6"/></svg>
      <button type="button" class="pickme" id="pickme" aria-label="Naar je positie"><i class="ti ti-current-location" aria-hidden="true"></i></button>
    </div>
    <button type="button" class="pickok" id="pickok"><i class="ti ti-check" aria-hidden="true"></i>Kies deze plek</button>
  </div>
  <div class="preview" id="preview" hidden>
    <div class="pmap" id="pmap"></div>
    <div class="psum" id="psum"></div>
    <div class="pbtns">
      <button type="button" class="roundbtn stopbig" id="stop" aria-label="Route stoppen"><i class="ti ti-x" aria-hidden="true"></i></button>
      <button type="button" class="roundbtn okbig" id="qok" aria-label="Route starten"><i class="ti ti-check" aria-hidden="true"></i></button>
    </div>
  </div>
</div>

<div class="start" id="start">
  <div class="start-card">
    <h1>VeloVerde</h1>
    <p>Zet je telefoon in een houder en laat een bijrijder de app bedienen.</p>
    <button id="startbtn">Start</button>
    <p class="small">De app vraagt om je locatie en houdt het scherm aan zolang hij open staat.</p>
  </div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="app.js?v=20"></script>
</body>
</html>
